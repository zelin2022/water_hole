# Install as /etc/systemd/journald@waterhole.conf; do not change global journald.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=16M
SystemMaxFileSize=2M
SystemKeepFree=1G
RuntimeMaxUse=8M
RuntimeMaxFileSize=2M
RuntimeKeepFree=64M
MaxRetentionSec=7day
RateLimitIntervalSec=60
RateLimitBurst=100
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
